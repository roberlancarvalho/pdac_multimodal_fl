line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # comprimento de linha (várias tabelas/docstrings longas)
    "B008",     # chamada em default de argumento (padrão de fábricas nn.*)
    "SIM105",   # try/except/pass -> contextlib.suppress (logging best-effort intencional)
    "RUF001", "RUF002", "RUF003",  # unicode ambíguo (texto em pt-BR nas docstrings)
    "RUF022",   # __all__ não ordenado
    "UP037",
]

[lint.per-file-ignores]
"tests/*" = ["F841", "RUF059", "PLR0124", "S101", "SIM300"]
"**/__init__.py" = ["F401"]
